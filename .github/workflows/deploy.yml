name: deploy

# Deploys CODE ONLY (Caddy binary with webdav plugin + config). Content stays
# out of git and is published via deploy/scripts/deploy-rsync.sh and/or the
# admin upload UI.

on:
  push:
    branches: [main]
    paths:
      - "Caddyfile"
      - "Caddyfile.dev"
      - "browse.html"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: cdn-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CADDY_WEBDAV_REF: fa2f366b0d75e54c2e381c0aefc3a8df8bf5794b
      SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build Caddy with WebDAV plugin
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
          "$(go env GOPATH)/bin/xcaddy" build \
            --with "github.com/mholt/caddy-webdav@${CADDY_WEBDAV_REF}" \
            --output ./caddy
          ./caddy version

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync code to VPS (/opt/cdn)
        run: |
          rsync -avz --delete -e "ssh -p $SSH_PORT" \
            ./caddy Caddyfile browse.html deploy/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/cdn/"

      - name: Apply on VPS
        run: |
          ssh -p "$SSH_PORT" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'sudo /usr/local/bin/cdn-apply'
