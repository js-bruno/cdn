name: cdn deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup golang
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'

      - name: Build caddy with webdav
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.7
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 "$(go env GOPATH)/bin/xcaddy" build v2.11.6 \
            --with "github.com/mholt/caddy-webdav@fa2f366b0d75e54c2e381c0aefc3a8df8bf5794b" \
            --output caddy

      - name: Hash admin password
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          ADMIN_PASSWORD_HASH="$(./caddy hash-password --plaintext "$ADMIN_PASSWORD")"
          echo "ADMIN_PASSWORD_HASH=$ADMIN_PASSWORD_HASH" >> "$GITHUB_ENV"

      - name: copy build to vps
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          target: "/home/lacon/cdn/"
          source: "caddy,Caddyfile,browse.html"
          tar_tmp_path: "/home/lacon/"
          debug: true

      - name: restart systemd service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ADMIN_PASSWORD_HASH
          script: |
            sudo /usr/local/bin/cdn-apply "$ADMIN_PASSWORD_HASH"
