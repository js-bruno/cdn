name: cdn deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup golang
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.4'

      - name: Build caddy with webdav
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 "$(go env GOPATH)/bin/xcaddy" build \
            --with "github.com/mholt/caddy-webdav@fa2f366b0d75e54c2e381c0aefc3a8df8bf5794b" \
            --output caddy

      - name: copy build to vps
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          target: "/home/lacon/cdn/"
          source: "caddy,Caddyfile,browse.html"
          tar_tmp_path: "/home/lacon/"
          debug: true

      - name: restart systemd service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: sudo /usr/local/bin/cdn-apply
